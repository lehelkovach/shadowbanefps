[/Script/Engine.InputSettings]
; The pilot uses Enhanced Input (see ShadowbaneFPS.uproject plugins). Input
; Actions / Mapping Contexts are authored as assets under /Game/Input and bound
; on the player pawn/controller. These legacy defaults exist only so a fresh
; checkout has sane fallbacks before those assets are created.
bEnableMouseSmoothing=False
bEnableFOVScaling=True
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
